<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지니의 재미있는 동물 유형 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #444;
        }
        .question {
            margin-bottom: 20px;
        }
        .answers label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>지니의 재미있는 동물 유형 테스트</h1>
        <form id="quiz-form">
            <div class="question">
                <p>1. 당신의 완벽한 주말은?</p>
                <div class="answers">
                    <label><input type="radio" name="q1" value="사자"> 계획표를 짜고 모두를 이끄는 카리스마 주말!</label>
                    <label><input type="radio" name="q1" value="돌고래"> 바다에서 신나게 물놀이하며 에너지 폭발!</label>
                    <label><input type="radio" name="q1" value="부엉이"> 조용히 책 한 권과 함께하는 힐링 주말!</label>
                    <label><input type="radio" name="q1" value="판다"> 소파와 한 몸이 되어 느긋한 하루!</label>
                </div>
            </div>
            
            <div class="question">
                <p>2. 친구가 위기에 처했을 때, 당신은?</p>
                <div class="answers">
                    <label><input type="radio" name="q2" value="사자"> "걱정 마! 내가 다 해결해줄게." 리더 모드 ON!</label>
                    <label><input type="radio" name="q2" value="돌고래"> 농담 한 마디로 긴장된 분위기를 바꾼다!</label>
                    <label><input type="radio" name="q2" value="부엉이"> 상황을 분석하고 현실적인 조언을 건넨다.</label>
                    <label><input type="radio" name="q2" value="판다"> 옆에서 묵묵히 위로하며 함께 있어준다.</label>
                </div>
            </div>

            <div class="question">
                <p>3. 여행에서 가장 하고 싶은 일은?</p>
                <div class="answers">
                    <label><input type="radio" name="q3" value="사자"> 그룹의 리더로 계획을 주도하며 탐험!</label>
                    <label><input type="radio" name="q3" value="돌고래"> 친구들과 시끌벅적 신나는 시간 보내기!</label>
                    <label><input type="radio" name="q3" value="부엉이"> 조용히 자연을 탐구하며 나만의 시간을 가진다.</label>
                    <label><input type="radio" name="q3" value="판다"> 숙소에서 여유롭게 쉰다.</label>
                </div>
            </div>

            <div class="question">
                <p>4. 당신이 선택하는 영화 장르는?</p>
                <div class="answers">
                    <label><input type="radio" name="q4" value="사자"> 액션과 스릴 넘치는 영화!</label>
                    <label><input type="radio" name="q4" value="돌고래"> 코미디와 로맨스, 기분 좋은 웃음!</label>
                    <label><input type="radio" name="q4" value="부엉이"> 다큐멘터리, 생각할 거리를 주는 영화.</label>
                    <label><input type="radio" name="q4" value="판다"> 힐링과 잔잔함이 있는 영화.</label>
                </div>
            </div>

            <div class="question">
                <p>5. 당신의 아침 루틴은?</p>
                <div class="answers">
                    <label><input type="radio" name="q5" value="사자"> 빠르게 준비하며 하루를 리드할 준비!</label>
                    <label><input type="radio" name="q5" value="돌고래"> 활기차게 음악 들으며 춤추는 아침!</label>
                    <label><input type="radio" name="q5" value="부엉이"> 조용히 커피 한 잔과 함께 시작.</label>
                    <label><input type="radio" name="q5" value="판다"> 늦잠 필수! 느릿느릿 여유롭게.</label>
                </div>
            </div>

            <div class="question">
                <p>6. 당신이 참여한 축제에서 어떤 역할을 맡고 싶나요?</p>
                <div class="answers">
                    <label><input type="radio" name="q6" value="사자"> 모두를 이끄는 퍼레이드 리더</label>
                    <label><input type="radio" name="q6" value="돌고래"> 춤추며 축제의 분위기를 살리는 에너지왕</label>
                    <label><input type="radio" name="q6" value="부엉이"> 멀리서 조용히 축제를 관찰하는 지혜로운 손님</label>
                    <label><input type="radio" name="q6" value="판다"> 한쪽에서 느긋하게 휴식하며 즐기는 힐링러</label>
                </div>
            </div>

            <div class="question">
                <p>7. 당신이 꿈꾸는 완벽한 하루는?</p>
                <div class="answers">
                    <label><input type="radio" name="q7" value="사자"> 새로운 도전을 계획하며 열정을 불태우는 날</label>
                    <label><input type="radio" name="q7" value="돌고래"> 친구들과 웃고 떠드는 유쾌한 하루</label>
                    <label><input type="radio" name="q7" value="부엉이"> 독서와 사색으로 가득 찬 하루</label>
                    <label><input type="radio" name="q7" value="판다"> 아무 걱정 없이 소파와 하나가 되는 하루</label>
                </div>
            </div>

            <div class="question">
                <p>8. 당신의 가장 큰 강점은 무엇인가요?</p>
                <div class="answers">
                    <label><input type="radio" name="q8" value="사자"> 뛰어난 리더십과 결단력</label>
                    <label><input type="radio" name="q8" value="돌고래"> 밝고 긍정적인 에너지</label>
                    <label><input type="radio" name="q8" value="부엉이"> 논리적 사고와 통찰력</label>
                    <label><input type="radio" name="q8" value="판다"> 평화로운 성격과 타인의 스트레스 해소</label>
                </div>
            </div>

            <div class="question">
                <p>9. 당신의 친구들이 자주 하는 말은?</p>
                <div class="answers">
                    <label><input type="radio" name="q9" value="사자"> "넌 진짜 리더야!"</label>
                    <label><input type="radio" name="q9" value="돌고래"> "너랑 있으면 너무 즐거워!"</label>
                    <label><input type="radio" name="q9" value="부엉이"> "넌 정말 똑똑하고 생각이 깊어."</label>
                    <label><input type="radio" name="q9" value="판다"> "넌 같이 있으면 정말 편안해."</label>
                </div>
            </div>

            <div class="question">
                <p>10. 갑자기 자유시간이 생긴다면 무엇을 할 건가요?</p>
                <div class="answers">
                    <label><input type="radio" name="q10" value="사자"> 새로운 프로젝트를 기획하거나 자기 계발에 몰두한다</label>
                    <label><input type="radio" name="q10" value="돌고래"> 사람들을 만나 함께 시간을 보낸다</label>
                    <label><input type="radio" name="q10" value="부엉이"> 집에서 조용히 나만의 시간을 즐긴다</label>
                    <label><input type="radio" name="q10" value="판다"> 낮잠 자며 완벽한 휴식을 취한다</label>
                </div>
            </div>

            <button type="button" onclick="calculateResult()">결과 보기</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        function calculateResult() {
            const answers = document.querySelectorAll('input[type="radio"]:checked');
            if (answers.length < 10) {
                alert("모든 질문에 답해주세요!");
                return;
            }

            const scores = {
                사자: 0,
                돌고래: 0,
                부엉이: 0,
                판다: 0
            };

            answers.forEach(answer => {
                scores[answer.value] += 1;
            });

            const sortedScores = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const topAnimal = sortedScores[0];
            const secondAnimal = sortedScores[1];

            const resultText = {
                사자: "당신은 사자입니다! 카리스마 넘치며 자신감이 있는 당신은 천생 리더입니다. 강렬한 존재감과 추진력으로 모두를 이끕니다!",
                돌고래: "당신은 돌고래입니다! 활기차고 사교적인 당신은 어디서나 분위기를 띄우는 사람입니다. 당신의 웃음은 전염성이 강합니다!",
                부엉이: "당신은 부엉이입니다! 지혜롭고 차분하며 항상 모든 것을 깊이 생각하는 타입입니다. 사람들은 당신에게서 믿음을 얻습니다!",
                판다: "당신은 판다입니다! 느긋하고 편안한 성격으로 주변에 평화를 선사합니다. 당신과 함께 있으면 누구나 마음이 편안해집니다!"
            };

            const keywords = {
                사자: "#리더십 #자신감 #추진력",
                돌고래: "#웃음전도사 #에너지폭발 #파티왕",
                부엉이: "#지혜 #분석력 #밤의철학자",
                판다: "#느긋함 #평화주의자 #힐링요정"
            };

            const result = `
                <p><strong>${resultText[topAnimal[0]]}</strong></p>
                <p>또한, 당신은 ${secondAnimal[0]}의 기질도 있습니다: ${resultText[secondAnimal[0]].replace(/당신은 .+?입니다! /, "")}</p>
                <p><strong>키워드:</strong> ${keywords[topAnimal[0]]}, ${keywords[secondAnimal[0]]}</p>
            `;

            document.getElementById('result').innerHTML = result;
        }
    </script>
</body>
</html>
